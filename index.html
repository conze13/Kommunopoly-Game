<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kommunopoly – spielbar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&display=swap">
<style>
:root{--bg:#EDEBE6;--fg:#26282A;--pn:#F8F7F4;--mu:#5B5D60;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1C1E;--fg:#ECEAE4;--pn:#26282A;--mu:#A9AAAC}}
:root[data-theme="dark"]{--bg:#1B1C1E;--fg:#ECEAE4;--pn:#26282A;--mu:#A9AAAC}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Archivo,Helvetica,Arial,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{margin:0;font-size:clamp(28px,6vw,44px);text-transform:uppercase;line-height:1}
.sub{margin:6px 0 16px;color:var(--mu);font-size:14px}
.wrap{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.bd{container-type:inline-size;flex:1 1 340px;max-width:560px;aspect-ratio:1;display:grid;grid-template:repeat(5,1fr)/repeat(5,1fr);background:#F2F0EB;color:#26282A;outline:2px solid #26282A}
.t{box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:.9cqw;font-size:1.6cqw;font-weight:800;text-transform:uppercase;line-height:1.05;box-shadow:inset 0 0 0 .25cqw #26282A;overflow:hidden;min-width:0}
.top{border-bottom:3cqw solid var(--c)}.rgt{border-left:3cqw solid var(--c)}.bot{border-top:3cqw solid var(--c)}.lft{border-right:3cqw solid var(--c)}
.k{background:#26282A;color:#F2F0EB;font-size:1.5cqw}
.k small{font-weight:500;letter-spacing:.1em;color:#B5B6B8;font-size:1.3cqw}
.tk{display:flex;flex-wrap:wrap;gap:.5cqw;align-items:center}
.pw{width:3.4cqw;height:3.4cqw;border-radius:50%;background:#A3463D;color:#fff;font-size:1.9cqw;display:inline-flex;align-items:center;justify-content:center}
.pw.k0{background:#26282A;box-shadow:0 0 0 .3cqw #F2F0EB}.k .pw.k0{background:#F2F0EB;color:#26282A}
.pw.on{box-shadow:0 0 0 .6cqw #E0A82E}
.hs{width:4.4cqw;fill:#26282A}.hs.oc{fill:#A3463D}.rg{fill:none;stroke:#26282A;stroke-width:1.7}
.ct{grid-area:2/2/5/5;background:#DCDAD5;box-shadow:inset 0 0 0 .25cqw #26282A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5cqw;text-align:center;padding:3cqw}
.ct b{font-size:6.6cqw;text-transform:uppercase;line-height:1}
.dk{width:13cqw;height:8.5cqw;background:#A3463D;border:.6cqw solid #26282A}
.cc{background:#F2F0EB;border:.5cqw solid #26282A;padding:2cqw;font-size:2cqw;line-height:1.3;max-width:34cqw;text-align:left}
.cc i{font-style:normal;font-weight:800;font-size:1.5cqw;letter-spacing:.1em;text-transform:uppercase;color:#A3463D}
.pnl{flex:1 1 300px;background:var(--pn);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 1.5px var(--fg)}
.ch{display:flex;gap:4px}.ch span{flex:1;text-align:center;padding:5px 0;font-weight:800;font-size:13px;background:#A3463D;color:#fff;opacity:.35}
.ch span.a{opacity:1}.ch span.c0{background:#26282A;color:#F2F0EB}
.pnl h2{margin:0;font-size:20px;text-transform:uppercase}
.st{font-size:13px;color:var(--mu)}
.rw{display:flex;gap:12px;align-items:center}
#die{width:56px;height:56px;border:3px solid var(--fg);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;flex:none}
button{flex:1;min-height:56px;font:800 15px Archivo,Helvetica,Arial,sans-serif;text-transform:uppercase;background:#26282A;color:#F2F0EB;border:0;cursor:pointer;padding:0 14px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button{background:#ECEAE4;color:#1B1C1E}}
.rule{border:1.5px solid var(--fg);padding:8px 10px;font-weight:800;font-size:13px;text-transform:uppercase;text-align:center}
.lg{font-size:13px;line-height:1.45;margin:0;padding:0;list-style:none;min-height:110px}.lg li{margin-bottom:3px}.lg li:first-child{font-weight:800}
.lh{font-size:12px;color:var(--mu);line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:6px}.opts button{flex:1 1 45%;min-height:44px;font-size:13px}
</style>
</head>
<body>
<main>
<h1>Kommunopoly</h1>
<p class="sub">Spielbar zu viert an einem Gerät: 1 Kapitalist gegen 3 Kommunisten. Reihum klicken.</p>
<div class="wrap"><div class="bd" id="bd"></div><div class="pnl" id="pn"></div></div>
</main>
<script>
const $=s=>document.getElementById(s),seq=[0,1,0,2,0,3],PN=['Kapitalist','Kommunist 1','Kommunist 2','Kommunist 3'],RL=12;
const NM=['Hafen&shy;straße','Rote Flora','Gänge&shy;viertel','Liebig&shy;straße','Rigaer Straße','Kottbusser Tor','Eppsteiner Straße','Kettenhofweg','Bockenheimer Landstraße','Luxem&shy;burger Straße','Stoll&shy;werck','Vogel&shy;sanger Straße'];
const POS=[[1,1],[1,2],[1,3],[1,4],[1,5],[2,5],[3,5],[4,5],[5,5],[5,4],[5,3],[5,2],[5,1],[4,1],[3,1],[2,1]];
const COL=['#8E9091','#A3463D','#BDAE92','#6F7A63'],SD=['top','rgt','bot','lft'];
const d6=()=>1+Math.floor(Math.random()*6),rnd=a=>a[Math.floor(Math.random()*a.length)];
const nm=i=>i%4?NM[i-1-(i>>2)].replace(/&shy;/g,''):'ein Ereignisfeld';
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const hc=()=>S.c.filter(x=>x.h).length,oc=()=>S.c.filter(x=>x.o).length,sc=()=>S.c.filter(x=>x.s).length,cur=()=>seq[S.t%6];
const mv=(j,d)=>{S.p[j]=(S.p[j]+d+16)%16},coms=()=>[1,2,3],L=j=>S.qu.push(()=>land(j)),all=[0,1,2,3];
const hl=f=>[...Array(16).keys()].filter(i=>i%4&&S.c[i].h&&f(S.c[i])).map(i=>[nm(i),i]);
const cp=()=>coms().map(j=>[PN[j],j]),pl=a=>a.map(j=>[PN[j]+' ('+nm(S.p[j])+')',j]);
function ask(w,q,o,cb){if(!o.length){log('Keine Auswahl möglich.');return}S.ch={w,q,o,cb};S.ph='ch'}
function pick(k){const c=S.ch;S.ch=null;S.ph='end';c.cb(c.o[k][1]);run();render()}
function run(){while(S.qu.length&&S.ph=='end')S.qu.shift()()}
function each(list,q,opts,fn,done){const st=n=>{if(n>=list.length){done();return}const j=list[n];ask(PN[j],q,opts,v=>{fn(j,v);st(n+1)})};st(0)}
const T=(s,n,x,f)=>({s,n,x,f});
const CARDS=[
T('C','Solidaritäts-Demo','Jeder Kommunist entscheidet selbst, ob er 1 oder 2 Felder vorzieht.',()=>{each(coms(),'1 oder 2 Felder vorziehen?',[['1 Feld',1],['2 Felder',2]],(j,v)=>{mv(j,v);log(PN[j]+' zieht '+v+' vor.')},()=>coms().forEach(L));return''}),
T('C','Autonome Direktbesetzung','Das Kollektiv wählt ein ungeschütztes Haus. Es wird sofort besetzt.',()=>{ask('Kollektiv','Welches ungeschützte Haus wird besetzt?',hl(c=>!c.s&&!c.o),i=>{S.c[i].o=1;log(nm(i)+' besetzt.')});return''}),
T('C','Mieterstreik & Blockade','Der Kapitalist verliert seine nächsten zwei Züge komplett.',()=>{S.sk[0]=2;return'Kapitalist setzt 2 Züge aus.'}),
T('C','Rechtsberatung vom Mieterverein','Das Kollektiv entfernt bis zu zwei Sicherheitschips seiner Wahl.',()=>{let n=0;const st=()=>{const o=hl(c=>c.s);if(n>=2||!o.length)return;ask('Kollektiv','Sicherheitschip entfernen ('+(n+1)+'/2)?',[...o,['Fertig',-1]],i=>{if(i<0)return;S.c[i].s=0;n++;log('Sicherheitschip bei '+nm(i)+' entfernt.');st()})};st();return''}),
T('C','Kiez-Netzwerk','Ein Kommunist darf sich zu einem anderen Kommunisten teleportieren.',()=>{ask('Kollektiv','Wer teleportiert sich?',cp(),m=>ask('Kollektiv',PN[m]+' teleportiert sich zu …',pl(coms().filter(j=>j!=m)),j=>{S.p[m]=S.p[j];log(PN[m]+' teleportiert sich nach '+nm(S.p[m])+'.');L(m)}));return''}),
T('C','Flugblatt-Aktion','Der Kapitalist zieht 3 Felder zurück.',()=>{mv(0,-3);L(0);return'Kapitalist zieht 3 zurück.'}),
T('C','Sabotage der Baupläne','Das Kollektiv reißt ein ungeschütztes Haus des Kapitalisten ab.',()=>{ask('Kollektiv','Welches Haus wird abgerissen?',hl(c=>!c.s&&!c.o),i=>{S.c[i].h=0;log(nm(i)+' abgerissen.')});return''}),
T('C','Rote Welle','Würfel: Bei 3–6 besetzt das Kollektiv ein an ein besetztes Haus angrenzendes Haus.',()=>{const r=d6();S.r=r;if(r<3)return'Würfel '+r+': nichts passiert.';const a=hl(c=>!c.s&&!c.o).filter(([n,i])=>[i-1,i+1].some(k=>k>0&&k<16&&k%4&&S.c[k].o));ask('Kollektiv','Würfel '+r+': Welches angrenzende Haus wird besetzt?',a,i=>{S.c[i].o=1;log(nm(i)+' besetzt.')});return'Würfel '+r}),
T('C','Genossenschafts-Fonds','Das Kollektiv bestimmt einen Kommunisten, der im nächsten Zug doppelt zieht.',()=>{ask('Kollektiv','Wer zieht doppelt?',cp(),j=>{S.dbl[j]=1;log(PN[j]+' zieht im nächsten Zug doppelt.')});return''}),
T('K','Sanierungskredit','Der Kapitalist legt einen Sicherheitschip auf ein Haus seiner Wahl (max. 3 im Spiel).',()=>{if(sc()>=3)return'Schon 3 Sicherheitschips im Spiel.';ask('Kapitalist','Welches Haus erhält einen Sicherheitschip?',hl(c=>!c.s&&!c.o),i=>{S.c[i].s=1;log('Sicherheitschip bei '+nm(i)+'.')});return''}),
T('K','Private Sicherheitsfirma','Der Kapitalist wählt ein besetztes Haus. Es wird sofort geräumt.',()=>{ask('Kapitalist','Welches Haus wird geräumt?',hl(c=>c.o),i=>{S.c[i].o=0;log(nm(i)+' geräumt.')});return''}),
T('K','Bürokratische Hürde','Wer diese Karte zieht, bestimmt einen Kommunisten, der seinen nächsten Zug aussetzt.',()=>{ask(PN[S.dw],'Welcher Kommunist setzt aus?',cp(),j=>{S.sk[j]=Math.max(S.sk[j],1);log(PN[j]+' setzt aus.')});return''}),
T('K','Polizeigewalt','Der Kapitalist legt sofort einen Sicherheitschip auf ein ungeschütztes Haus (max. 3).',()=>{if(sc()>=3)return'Schon 3 Sicherheitschips im Spiel.';ask('Kapitalist','Welches Haus wird geschützt?',hl(c=>!c.s&&!c.o),i=>{S.c[i].s=1;log('Sicherheitschip bei '+nm(i)+'.')});return''}),
T('K','Kurzfristige Räumung','Landet der Kapitalist im nächsten Zug auf einem besetzten Feld, gelingt die Räumung automatisch.',()=>{if(cur())S.arA=1;else S.arP=1;return'Nächste Räumung gelingt automatisch.'}),
T('N','Großdemo im Viertel','Alle Spieler ziehen sofort 1 Feld zurück.',()=>{all.forEach(j=>mv(j,-1));all.forEach(L);return'Alle 1 Feld zurück.'}),
T('N','Urabstimmung','Würfel: Bei 3–6 wird ein zufälliges Haus besetzt.',()=>{const r=d6();S.r=r;if(r<3)return'Würfel '+r+': nichts passiert.';const o=hl(c=>!c.o);if(!o.length)return'Würfel '+r+': kein Haus frei.';const i=rnd(o)[1];S.c[i].o=1;S.c[i].s=0;return'Würfel '+r+': '+nm(i)+' besetzt.'}),
T('N','Verkehrschaos','Alle Spieler ziehen im nächsten Zug exakt 1 Feld, statt zu würfeln.',()=>{S.ex=[1,1,1,1];return'Alle ziehen nächstes Mal exakt 1 Feld.'}),
T('N','Stadtteilfest','Alle Spieler erhalten im nächsten Zug +1 Feld Bonus.',()=>{S.bn=[1,1,1,1];return'Alle +1 Feld im nächsten Zug.'}),
T('N','Kiezspaziergang','Jeder Spieler entscheidet selbst, ob er 1 Feld vor oder zurück geht.',()=>{each(all,'1 Feld vor oder zurück?',[['1 vor',1],['1 zurück',-1]],(j,v)=>{mv(j,v);log(PN[j]+(v>0?' geht 1 vor.':' geht 1 zurück.'))},()=>all.forEach(L));return''}),
T('N','Platztausch','Wer die Karte zieht, bestimmt zwei Spieler, die ihre Plätze tauschen.',()=>{const w=PN[S.dw];ask(w,'Erster Spieler?',pl(all),a=>ask(w,PN[a]+' tauscht mit …',pl(all.filter(j=>j!=a)),b=>{[S.p[a],S.p[b]]=[S.p[b],S.p[a]];log(PN[a]+' und '+PN[b]+' tauschen die Plätze.');L(a);L(b)}));return''})];
const TAG={K:'Kapitalist',C:'Kollektiv',N:'Neutral'};
let S;
function init(){S={p:[0,0,0,0],t:0,c:Array.from({length:16},()=>({h:0,s:0,o:0})),dk:shuf(CARDS.map((_,i)=>i)),ds:[],sk:[0,0,0,0],dbl:[0,0,0,0],ex:[0,0,0,0],bn:[0,0,0,0],arA:0,arP:0,ch:null,qu:[],ap:0,dw:0,ph:'move',ctx:null,r:null,lg:['Neues Spiel. Der Kapitalist beginnt.'],card:null,over:0};render()}
function log(m){S.lg.unshift(m)}
function next(){if(cur()==0){S.arA=0;if(S.arP){S.arA=1;S.arP=0}}
S.t++;S.ph='move';S.ctx=null;
if(S.t>=RL*6){S.over=1;return}
if(S.sk[cur()]>0){S.sk[cur()]--;log(PN[cur()]+' setzt aus.');next()}}
function draw(p){if(!S.dk.length){S.dk=shuf(S.ds);S.ds=[]}const id=S.dk.pop();S.ds.push(id);const cd=CARDS[id];S.card=cd;S.dw=p;const r=cd.f();log(PN[p]+' zieht „'+cd.n+'“'+(r?': '+r:''))}
function act(p,t,m){S.ph='act';S.ap=p;S.ctx=t;log(m)}
function land(p){const i=S.p[p],c=S.c[i];
if(i%4==0){draw(p);return}
if(p==0){if(!c.h){if(hc()<12){c.h=1;log('Haus gebaut.')}else log('Alle 12 Häuser stehen schon.')}
else if(c.o){if(S.arA){c.o=0;log('Kurzfristige Räumung: Haus automatisch geräumt.')}else act(0,'ev','Besetztes Haus: Der Kapitalist würfelt für die Räumung.')}
else if(!c.s){if(sc()<3){c.s=1;log('Eigenes Haus: Sicherheitschip gelegt.')}else log('Schon 3 Sicherheitschips im Spiel. Das Haus bleibt ungeschützt.')}
else log('Das Haus ist schon geschützt.')}
else{if(!c.h)log(PN[p]+': Leere Straße. Nichts passiert.');else if(c.o)log(PN[p]+': Schon besetzt.');
else if(c.s)act(p,'un',PN[p]+' steht auf einem geschützten Haus und würfelt für den Sicherheitschip.');
else if(coms().some(j=>j!=p&&S.p[j]==i)){c.o=1;log('Zwei Kommunisten: Haus sofort besetzt!')}
else act(p,'oc',PN[p]+' steht auf einem ungeschützten Haus und würfelt zum Besetzen.')}}
function go(){if(S.over){init();return}
if(S.ph=='move'){const p=cur();let m,r=null;if(S.ex[p]){m=1;S.ex[p]=0}else{r=d6();S.r=r;m=r;if(S.dbl[p]){m*=2;S.dbl[p]=0}}if(S.bn[p]){m++;S.bn[p]=0}
S.p[p]=(S.p[p]+m)%16;log(PN[p]+(r?' würfelt '+r:' darf nicht würfeln')+' und zieht '+m+' Felder auf '+nm(S.p[p])+'.');S.ph='end';land(p);run()}
else if(S.ph=='act'){const p=S.ap,r=d6(),ok=r>=4,c=S.c[S.p[p]],t=S.ctx;S.r=r;
if(t=='un'){if(ok)c.s=0;log(ok?'Erfolg: Sicherheitschip entfernt.':'Misserfolg: Sicherheitschip bleibt.')}
if(t=='oc'){if(ok)c.o=1;log(ok?'Erfolg: Haus besetzt!':'Misserfolg: nicht besetzt.')}
if(t=='ev'){if(ok)c.o=0;log(ok?'Erfolg: Haus geräumt.':'Misserfolg: Besetzung bleibt.')}
S.ph='end';run()}
else next();render()}
function render(){const p=cur();let h='';
for(let i=0;i<16;i++){const[r,c]=POS[i],cl=S.c[i],pw=[0,1,2,3].filter(j=>S.p[j]==i).map(j=>`<span class="pw${j?'':' k0'}${j==p&&!S.over?' on':''}">${j?j:'K'}</span>`).join('');
if(i%4==0)h+=`<div class="t k" style="grid-area:${r}/${c}"><small>EREIGNIS</small><div>${i?'':'START →'}<div class="tk">${pw}</div></div></div>`;
else{const hs=cl.h?`<svg class="hs${cl.o?' oc':''}" viewBox="0 0 20 20"><path d="M2 10L10 3L18 10V18H2Z"/>${cl.s?'<circle class="rg" cx="10" cy="10.5" r="9.4"/>':''}</svg>`:'';
h+=`<div class="t ${SD[i>>2]}" style="grid-area:${r}/${c};--c:${COL[i>>2]}"><div>${NM[i-1-(i>>2)]}</div><div class="tk">${hs}${pw}</div></div>`}}
const cd=S.card;
h+=`<div class="ct"><b>Kommunopoly</b>${cd?`<div class="cc"><i>${TAG[cd.s]}</i><br><b style="font-size:2.4cqw;text-transform:none">${cd.n}</b><br>${cd.x}</div>`:'<div class="dk"></div>'}<div style="font-size:1.6cqw;font-weight:500">Ereigniskarten · ${S.dk.length} im Stapel</div></div>`;
$('bd').innerHTML=h;
const R=Math.min(Math.floor(S.t/6)+1,RL),btn=S.over?'Neues Spiel':S.ph=='move'?'Würfeln & ziehen':S.ph=='act'?PN[S.ap]+' würfelt für die Aktion':'Zug beenden';
const win=S.over?`<h2>${oc()>6?'Das Kollektiv gewinnt':'Der Kapitalist gewinnt'}</h2><div class="st">${oc()} von 12 Straßen sind besetzt. Das Kollektiv braucht mehr als 6.</div>`:`<h2>${PN[p]} ist dran</h2><div class="st">Runde ${R} von ${RL} · Häuser ${hc()}/12 · besetzt ${oc()} · Chips ${sc()}/3</div>`;
const ctl=S.ch?`<div class="st"><b>${S.ch.w} entscheidet:</b> ${S.ch.q}</div><div class="opts">${S.ch.o.map((o,k)=>`<button data-k="${k}">${o[0]}</button>`).join('')}</div>`:`<div class="rw"><div id="die">${S.r??'–'}</div><button id="go">${btn}</button></div>`;
$('pn').innerHTML=`<div class="ch">${seq.map((j,k)=>`<span class="${j?'':'c0'}${k==S.t%6&&!S.over?' a':''}">${j?j:'K'}</span>`).join('')}</div>${win}${ctl}<div class="rule">1–3 Misserfolg · 4–6 Erfolg</div><ul class="lg">${S.lg.slice(0,6).map(x=>'<li>'+x+'</li>').join('')}</ul><div class="lh">Haus = Quadrat mit Dach · Ring = Sicherheitschip (max. 3) · rotes Haus = besetzt. Das Kollektiv gewinnt, wenn nach ${RL} Runden mehr als 6 der 12 Straßen besetzt sind.</div>`;
if(S.ch)document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>pick(+b.dataset.k));else $('go').onclick=go}
init();
</script>
</body>
</html>
